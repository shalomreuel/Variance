name: Verify Variant Zero
on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt pytest httpx gdtoolkit
      - run: python -m pytest -q backend/tests
      - run: gdparse scripts/*.gd tests/*.gd

  godot:
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: /tmp/variant-zero-ci-profile
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.6
        run: |
          curl -fLsS --retry 3 'https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip' -o godot.zip
          unzip -q godot.zip
          mv Godot_v4.6-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import assets and parse project
        run: ./godot --headless --path . --editor --import --quit
      - name: Deterministic inheritance and learner tests
        run: ./godot --headless --path . --script tests/genetics_test.gd
      - name: Full offline interaction loop
        run: ./godot --headless --path . --script tests/smoke_loop.gd
      - name: Persistent learner profile
        run: ./godot --headless --path . --script tests/persistence_test.gd
