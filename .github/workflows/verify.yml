name: Verify Variant Zero
on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -r backend/requirements.txt pytest httpx gdtoolkit
      - run: python -m pytest -q backend/tests
      - run: gdparse scripts/*.gd tests/*.gd

  godot:
    runs-on: ubuntu-latest
    env:
      XDG_DATA_HOME: /tmp/variant-zero-ci-profile
    steps:
      - uses: actions/checkout@v5
      - name: Install Godot 4.6
        run: |
          curl -fLsS --retry 3 'https://github.com/godotengine/godot/releases/download/4.6-stable/Godot_v4.6-stable_linux.x86_64.zip' -o godot.zip
          unzip -q godot.zip
          mv Godot_v4.6-stable_linux.x86_64 godot
          chmod +x godot
      - name: Import assets and parse project
        run: |
          ./godot --headless --path . --editor --import --quit > import.log 2>&1
          cat import.log
          if grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource' import.log; then
            echo "::error::$(grep -E 'SCRIPT ERROR|Parse Error|Failed to load script|Failed to load resource' import.log | tail -n 30 | tr '\n' ' ' | cut -c 1-3500)"
            exit 1
          fi
      - name: Deterministic inheritance and learner tests
        run: |
          ./godot --headless --path . --script tests/genetics_test.gd > genetics.log 2>&1 || {
            cat genetics.log
            echo "::error::$(tail -n 55 genetics.log | tr '\n' ' ' | cut -c 1-3500)"
            exit 1
          }
          cat genetics.log
      - name: Full offline interaction loop
        run: |
          ./godot --headless --path . --script tests/smoke_loop.gd > smoke.log 2>&1 || {
            cat smoke.log
            echo "::error::$(tail -n 55 smoke.log | tr '\n' ' ' | cut -c 1-3500)"
            exit 1
          }
          cat smoke.log
      - name: Persistent learner profile
        run: |
          ./godot --headless --path . --script tests/persistence_test.gd > persistence.log 2>&1 || {
            cat persistence.log
            echo "::error::$(tail -n 55 persistence.log | tr '\n' ' ' | cut -c 1-3500)"
            exit 1
          }
          cat persistence.log
